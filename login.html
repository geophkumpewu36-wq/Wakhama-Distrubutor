<!DOCTYPE html>
<html lang="ny">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Wakhama Distributor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .bg-spotify-green { background-color: #1DB954; }
        .text-spotify-green { color: #1DB954; }
    </style>
</head>
<body class="bg-[#0b0f17] text-white min-h-screen flex items-center justify-center p-4">

    <div class="bg-[#161b26] p-8 rounded-2xl border border-gray-800 w-full max-w-md text-center space-y-6">
        <h2 class="text-2xl font-bold">Lowa mu Wakhama</h2>
        <p class="text-gray-400 text-sm">Lowa ndi Gmail kapena Phone Number kuti mumvetsere ndi kutsitsa nyimbo.</p>

        <!-- Google Login -->
        <button type="button" onclick="loginGoogle()" class="w-full bg-white text-black font-bold py-3 rounded-xl flex items-center justify-center gap-3 hover:bg-gray-200 transition">
            <i class="fa-brands fa-google text-red-500 text-xl"></i> Lowa ndi Gmail
        </button>

        <div class="text-xs text-gray-500 font-bold uppercase">KAPENA</div>

        <!-- Phone Login -->
        <div class="space-y-3">
            <input type="tel" id="userPhone" placeholder="099... / 088..." class="w-full bg-[#0b0f17] border border-gray-700 p-3 rounded-xl text-white text-sm focus:outline-none focus:border-green-500">
            <button type="button" onclick="loginPhone()" class="w-full bg-spotify-green text-black font-bold py-3 rounded-xl hover:opacity-90 transition">
                <i class="fa-solid fa-phone mr-1"></i> Lowa ndi Phone Number
            </button>
        </div>
    </div>

    <script src="client.js"></script>
    <script>
        function completeLogin(userData) {
            localStorage.setItem('wakhama_user', JSON.stringify(userData));
            localStorage.setItem('user', JSON.stringify(userData));
            window.location.href = 'music.html';
        }

        async function loginGoogle() {
            const email = prompt("Ikani Email yanu ya Gmail:");
            if (!email) return;

            const userData = { id: Date.now().toString(), type: 'gmail', identifier: email };
            
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ loginType: 'google', identifier: email })
                });
                const data = await res.json();
                if (data.success && data.user) {
                    completeLogin(data.user);
                    return;
                }
            } catch (e) {
                console.log("Backend query failed, saving locally");
            }

            completeLogin(userData);
        }

        async function loginPhone() {
            const phoneInput = document.getElementById('userPhone');
            const phone = phoneInput ? phoneInput.value.trim() : '';

            if(!phone) {
                alert("Chonde ikani nambala yanu ya foni!");
                return;
            }

            const userData = { id: Date.now().toString(), type: 'phone', identifier: phone };

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ loginType: 'phone', identifier: phone })
                });
                const data = await res.json();
                if (data.success && data.user) {
                    completeLogin(data.user);
                    return;
                }
            } catch (e) {
                console.log("Backend query failed, saving locally");
            }

            completeLogin(userData);
        }
    </script>
</body>
</html>
