<!DOCTYPE html>
<html lang="ny">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Wakhama Distributor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .bg-spotify-green { background-color: #1DB954; }
        .text-spotify-green { color: #1DB954; }
    </style>
</head>
<body class="bg-[#0b0f17] text-white p-6 min-h-screen">

    <div class="max-w-6xl mx-auto space-y-6">
        <header class="flex justify-between items-center border-b border-gray-800 pb-4">
            <div>
                <h1 class="text-2xl font-bold text-spotify-green flex items-center gap-2">
                    <i class="fa-solid fa-user-shield"></i> Wakhama Admin Dashboard
                </h1>
                <p class="text-xs text-gray-400">Manage all uploaded songs and monetization earnings.</p>
            </div>
            <a href="index.html" class="text-xs bg-gray-800 px-3 py-2 rounded-lg hover:bg-gray-700">← Public Home</a>
        </header>

        <!-- Stats Overview -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-[#161b26] p-5 rounded-2xl border border-gray-800">
                <p class="text-xs text-gray-400 uppercase font-bold">ZOTSITSA ZONSE (TOTAL DOWNLOADS)</p>
                <h2 id="totalDownloads" class="text-3xl font-extrabold text-white mt-1">0</h2>
            </div>
            <div class="bg-[#161b26] p-5 rounded-2xl border border-gray-800">
                <p class="text-xs text-gray-400 uppercase font-bold">NDALAMA ZONSE (TOTAL REVENUE)</p>
                <h2 id="totalRevenue" class="text-3xl font-extrabold text-spotify-green mt-1">MK 0</h2>
            </div>
            <div class="bg-[#161b26] p-5 rounded-2xl border border-gray-800">
                <p class="text-xs text-gray-400 uppercase font-bold">CHIWERENGERO CHA NYIMBO</p>
                <h2 id="totalSongs" class="text-3xl font-extrabold text-white mt-1">0</h2>
            </div>
        </div>

        <!-- Songs Table -->
        <div class="bg-[#161b26] rounded-2xl border border-gray-800 p-6 overflow-x-auto">
            <h3 class="font-bold text-lg mb-4">Mndandanda Wa Nyimbo Zonse</h3>
            <table class="w-full text-left text-sm text-gray-300">
                <thead class="bg-[#0b0f17] text-xs uppercase text-gray-400 border-b border-gray-800">
                    <tr>
                        <th class="p-3">Title</th>
                        <th class="p-3">Artist</th>
                        <th class="p-3">Price</th>
                        <th class="p-3">Downloads</th>
                        <th class="p-3">Earnings</th>
                    </tr>
                </thead>
                <tbody id="adminSongsTable">
                    <!-- Data ipita pano -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadAdminData() {
            try {
                const res = await fetch('/api/songs');
                const songs = await res.json();

                let downloads = 0;
                let revenue = 0;

                const tbody = document.getElementById('adminSongsTable');
                tbody.innerHTML = '';

                songs.forEach(song => {
                    downloads += (song.downloadsCount || 0);
                    revenue += (song.earningsMWK || 0);

                    tbody.innerHTML += `
                        <tr class="border-b border-gray-800/50 hover:bg-[#0b0f17]/50">
                            <td class="p-3 font-semibold text-white">${song.songTitle}</td>
                            <td class="p-3">${song.artistName}</td>
                            <td class="p-3 text-spotify-green">MK ${song.price || 100}</td>
                            <td class="p-3">${song.downloadsCount || 0}</td>
                            <td class="p-3 font-bold text-spotify-green">MK ${song.earningsMWK || 0}</td>
                        </tr>
                    `;
                });

                document.getElementById('totalDownloads').innerText = downloads;
                document.getElementById('totalRevenue').innerText = 'MK ' + revenue;
                document.getElementById('totalSongs').innerText = songs.length;

            } catch (err) {
                console.error(err);
            }
        }

        loadAdminData();
    </script>
</body>
</html>
