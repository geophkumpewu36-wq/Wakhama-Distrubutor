<!DOCTYPE html>
<html lang="ny">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mvetserani & Tsitsani - Wakhama</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .bg-spotify-green { background-color: #1DB954; }
        .text-spotify-green { color: #1DB954; }
    </style>
</head>
<body class="bg-[#0b0f17] text-white p-6 min-h-screen">

    <div class="max-w-4xl mx-auto space-y-6">
        <header class="flex justify-between items-center border-b border-gray-800 pb-4">
            <h1 class="text-2xl font-bold text-spotify-green flex items-center gap-2">
                <i class="fa-solid fa-headphones"></i> Wakhama Music
            </h1>
            <div class="flex items-center gap-3">
                <div id="userBadge" class="text-xs bg-gray-800 px-3 py-1.5 rounded-full text-gray-300"></div>
                <button onclick="logout()" class="text-xs bg-red-600/20 text-red-400 border border-red-500/30 px-3 py-1 rounded-full hover:bg-red-600 hover:text-white transition">Log Out</button>
            </div>
        </header>

        <div id="songsList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Nyimbo zizionetsedwa pano -->
        </div>
    </div>

    <script>
        // Verificare permisivă a autentificării
        const rawUser = localStorage.getItem('user') || localStorage.getItem('wakhama_user');
        let user = null;

        if (rawUser) {
            try { user = JSON.parse(rawUser); } catch(e) { user = null; }
        }

        // Redirecționează DOAR dacă nu există absolut nicio informație de autentificare
        if (!user) {
            window.location.href = 'login.html';
        } else {
            const name = user.identifier || user.email || user.phone || "User";
            document.getElementById('userBadge').innerText = "Logged in: " + name;
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        async function loadSongs() {
            try {
                const res = await fetch('/api/songs');
                const songs = await res.json();
                
                const container = document.getElementById('songsList');
                if(!songs || songs.length === 0) {
                    container.innerHTML = `<p class="text-gray-400">Palibe nyimbo zomwe zaikidwa panopa.</p>`;
                    return;
                }

                container.innerHTML = songs.map(song => `
                    <div class="bg-[#161b26] p-4 rounded-xl border border-gray-800 space-y-3">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 bg-green-900/40 rounded-lg flex items-center justify-center font-bold text-spotify-green text-xl">🎵</div>
                            <div>
                                <h3 class="font-bold text-white text-sm">${song.songTitle || 'Nyimbo'}</h3>
                                <p class="text-xs text-gray-400">${song.artistName || 'Artist'} • <span class="text-spotify-green font-semibold">MK ${song.price || 100}</span></p>
                            </div>
                        </div>
                        <audio controls src="${song.audioUrl}" class="w-full h-8"></audio>
                        <button onclick="downloadSong('${song.id}')" class="w-full bg-spotify-green hover:opacity-90 text-black font-bold py-2 rounded-lg text-xs flex items-center justify-center gap-2">
                            <i class="fa-solid fa-download"></i> Lipira & Tsitsa Nyimbo
                        </button>
                    </div>
                `).join('');
            } catch(e) {
                console.error(e);
            }
        }

        async function downloadSong(songId) {
            try {
                const res = await fetch('/api/songs/' + songId + '/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: user ? user.id : '1' })
                });
                const data = await res.json();
                if (data.success) { window.location.href = data.downloadUrl; }
            } catch(e) {
                alert("Vuto lapezeka.");
            }
        }

        loadSongs();
    </script>
</body>
</html>
